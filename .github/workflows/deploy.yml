name: GitHub Pages へデプロイ

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GitHub Pages を設定
        uses: actions/configure-pages@v5

      - name: site フォルダをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
