<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森のアトリエ | AIアートの世界へ</title>
  <style>
    /* =============================================
       promo.html 専用スタイル
       ============================================= */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap');

    :root {
      --green-dark:  #2d6a4f;
      --green-mid:   #40916c;
      --green-light: #52b788;
      --green-pale:  #d8f3dc;
      --orange:      #f4a261;
      --orange-dark: #e76f51;
      --white:       #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans JP', '游ゴシック', YuGothic, sans-serif;
      background: #0a1a0f;
    }

    /* =============================================
       背景パーティクル（葉）
       ============================================= */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* =============================================
       メインコンテナ
       ============================================= */
    .promo-wrap {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* =============================================
       ロゴ・タイトル
       ============================================= */
    .promo-logo {
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: var(--green-pale);
      letter-spacing: 0.2em;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeDown 1s ease 0.5s forwards;
    }

    .promo-title {
      font-size: clamp(2.4rem, 8vw, 5.5rem);
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-align: center;
      margin: 1rem 0 0.5rem;
      opacity: 0;
      animation: fadeUp 1.2s ease 1s forwards;
    }

    .promo-title span {
      color: var(--orange);
    }

    /* =============================================
       キャッチコピー（テキストが流れるアニメ）
       ============================================= */
    .promo-catchcopy {
      font-size: clamp(0.9rem, 2.5vw, 1.25rem);
      color: var(--green-pale);
      letter-spacing: 0.08em;
      margin-top: 1.5rem;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid var(--orange);
      width: 0;
      animation:
        typing 2.5s steps(22, end) 2s forwards,
        blink-caret 0.75s step-end infinite 2s;
    }

    /* =============================================
       アート作品フェードインカード
       ============================================= */
    .artwork-row {
      display: flex;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      margin-top: clamp(2rem, 5vh, 3.5rem);
    }

    .artwork-card {
      width: clamp(80px, 16vw, 160px);
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* 各カードを順番にフェードイン */
    .artwork-card:nth-child(1) { animation: cardFadeIn 0.9s ease 3.5s forwards; }
    .artwork-card:nth-child(2) { animation: cardFadeIn 0.9s ease 3.9s forwards; }
    .artwork-card:nth-child(3) { animation: cardFadeIn 0.9s ease 4.3s forwards; }
    .artwork-card:nth-child(4) { animation: cardFadeIn 0.9s ease 4.7s forwards; }
    .artwork-card:nth-child(5) { animation: cardFadeIn 0.9s ease 5.1s forwards; }

    /* 実際の画像がない場合の代替グラデーション */
    .artwork-card:nth-child(1) { background: linear-gradient(160deg, #1b4332 0%, #40916c 50%, #95d5b2 100%); }
    .artwork-card:nth-child(2) { background: linear-gradient(160deg, #2d6a4f 0%, #52b788 60%, #b7e4c7 100%); }
    .artwork-card:nth-child(3) { background: linear-gradient(160deg, #1a472a 0%, #2d6a4f 40%, #f4a261 100%); }
    .artwork-card:nth-child(4) { background: linear-gradient(160deg, #081c15 0%, #1b4332 50%, #52b788 100%); }
    .artwork-card:nth-child(5) { background: linear-gradient(160deg, #2d6a4f 0%, #e76f51 60%, #f4a261 100%); }

    .artwork-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ホバー時に輝く */
    .artwork-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
    }

    /* =============================================
       CTA ボタン
       ============================================= */
    .promo-cta {
      margin-top: clamp(1.5rem, 4vh, 2.5rem);
      opacity: 0;
      animation: fadeUp 0.8s ease 6s forwards;
    }

    .promo-btn {
      display: inline-block;
      padding: 0.8rem 2.5rem;
      background-color: var(--orange);
      color: var(--white);
      font-family: inherit;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(244, 162, 97, 0.4);
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .promo-btn:hover {
      background-color: var(--orange-dark);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 28px rgba(231, 111, 81, 0.5);
    }

    /* =============================================
       底部サイト名（流れるスクロールテキスト）
       ============================================= */
    .promo-ticker {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(45, 106, 79, 0.85);
      backdrop-filter: blur(6px);
      padding: 0.6rem 0;
      overflow: hidden;
      z-index: 20;
      opacity: 0;
      animation: fadeUp 0.6s ease 6.5s forwards;
    }

    .promo-ticker-inner {
      display: inline-flex;
      white-space: nowrap;
      animation: tickerScroll 18s linear infinite;
    }

    .promo-ticker-inner span {
      font-size: 0.85rem;
      color: var(--green-pale);
      letter-spacing: 0.15em;
      padding: 0 3rem;
    }

    .promo-ticker-inner span em {
      color: var(--orange);
      font-style: normal;
      font-weight: 700;
    }

    /* =============================================
       キーフレーム
       ============================================= */
    @keyframes fadeDown {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardFadeIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes typing {
      to { width: 22em; }
    }

    @keyframes blink-caret {
      50% { border-color: transparent; }
    }

    @keyframes tickerScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <!-- 背景パーティクルキャンバス -->
  <canvas id="canvas-bg"></canvas>

  <!-- メインコンテンツ -->
  <div class="promo-wrap">

    <p class="promo-logo">🌿 MORI NO ATELIER</p>

    <h1 class="promo-title">
      AIが描く、<br><span>森の物語</span>
    </h1>

    <p class="promo-catchcopy">テクノロジーと自然が交差する世界</p>

    <!-- 作品カード（フェードイン） -->
    <div class="artwork-row">
      <div class="artwork-card">
        <img src="images/artwork-01.jpg" alt="朝霧の森">
      </div>
      <div class="artwork-card">
        <img src="images/artwork-02.jpg" alt="深緑の光">
      </div>
      <div class="artwork-card">
        <img src="images/artwork-03.jpg" alt="秋の木漏れ日">
      </div>
      <div class="artwork-card">
        <img src="images/artwork-04.jpg" alt="雨上がりの雫">
      </div>
      <div class="artwork-card">
        <img src="images/artwork-05.jpg" alt="星降る夜の森">
      </div>
    </div>

    <!-- CTAボタン -->
    <div class="promo-cta">
      <a href="gallery.html" class="promo-btn">作品を見る →</a>
    </div>

  </div>

  <!-- 下部ティッカー -->
  <div class="promo-ticker">
    <div class="promo-ticker-inner">
      <span>🌿 森のアトリエ &nbsp;｜&nbsp; <em>AI生成アート</em> の販売サイト &nbsp;｜&nbsp; 世界にひとつの作品をあなたに &nbsp;｜&nbsp; 🌿 森のアトリエ &nbsp;｜&nbsp; <em>AI生成アート</em> の販売サイト &nbsp;｜&nbsp; 世界にひとつの作品をあなたに &nbsp;｜&nbsp;</span>
      <span>🌿 森のアトリエ &nbsp;｜&nbsp; <em>AI生成アート</em> の販売サイト &nbsp;｜&nbsp; 世界にひとつの作品をあなたに &nbsp;｜&nbsp; 🌿 森のアトリエ &nbsp;｜&nbsp; <em>AI生成アート</em> の販売サイト &nbsp;｜&nbsp; 世界にひとつの作品をあなたに &nbsp;｜&nbsp;</span>
    </div>
  </div>

  <script>
    /* =============================================
       背景パーティクル（浮かぶ葉・光の粒）
       ============================================= */
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let W, H;
    const particles = [];
    const COUNT = 60;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    /* パーティクル初期化 */
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x:     Math.random() * window.innerWidth,
        y:     Math.random() * window.innerHeight,
        r:     Math.random() * 3 + 1,
        vx:    (Math.random() - 0.5) * 0.4,
        vy:    -(Math.random() * 0.5 + 0.2),
        alpha: Math.random() * 0.5 + 0.1,
        /* 葉型か光の粒かをランダムに */
        isLeaf: Math.random() > 0.6,
        rotate: Math.random() * Math.PI * 2,
        rotateSpeed: (Math.random() - 0.5) * 0.02,
        color: Math.random() > 0.5
          ? `rgba(82, 183, 136, `
          : `rgba(244, 162, 97, `,
      });
    }

    function drawLeaf(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotate);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color + p.alpha + ')';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r * 3, p.r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawDot(p) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color + p.alpha + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);

      for (const p of particles) {
        p.isLeaf ? drawLeaf(p) : drawDot(p);

        p.x += p.vx;
        p.y += p.vy;
        p.rotate += p.rotateSpeed;

        /* 画面外に出たらリセット */
        if (p.y < -20) {
          p.y = H + 20;
          p.x = Math.random() * W;
        }
        if (p.x < -20) p.x = W + 20;
        if (p.x > W + 20) p.x = -20;
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
